<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>html,body{height:100%;overflow:hidden}
body{display:block;position:relative;
     background:radial-gradient(ellipse at 50% 34%,#16203a 0%,#05070c 74%)}
#band{width:168%;opacity:.95;position:absolute;top:70%;left:50%;transform:translate(-50%,-50%);
      -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 12%,#000 88%,transparent 100%),
                         linear-gradient(to bottom,transparent 0%,#000 18%,#000 74%,transparent 100%);
      -webkit-mask-composite:source-in;mask-composite:intersect}
.mid{position:absolute;top:27%;left:50%;transform:translate(-50%,-50%);
     text-align:center;padding:8px 4px;
     box-shadow:0 0 70px 46px rgba(5,7,12,.72);background:rgba(5,7,12,.55);border-radius:14px}
.mid .t{display:flex;justify-content:center;filter:drop-shadow(0 0 14px rgba(110,168,255,.55))}
.mid .s{display:flex;justify-content:center;margin-top:14px;opacity:.8}
</style>
<body>
<img id="band" src="fleet_band.png">
<div class="mid"><div class="t" id="t"></div><div class="s" id="s"></div></div>
<script src="../app/pixelfont.js"></script>
<script>
document.getElementById("t").appendChild(PixelFont.render("PIXELSHIP",{scale:10,color:"#eaf1ff",shadow:{dx:0,dy:1,color:"#16203a"}}));
document.getElementById("s").appendChild(PixelFont.render("SPACESHIP GENERATOR",{scale:4,color:"#9db0d0"}));
</script>
</body>
